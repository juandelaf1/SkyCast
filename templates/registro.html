<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h1 class="text-3xl font-bold text-cyan-400 mb-2 text-center">🌦️ SkyCast</h1>
        <p class="text-slate-400 text-center mb-8">Crear cuenta</p>

        {% if error %}
        <div class="bg-red-900/50 border border-red-700 text-red-300 px-4 py-3 rounded mb-6 text-sm">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="bg-green-900/50 border border-green-700 text-green-300 px-4 py-3 rounded mb-6 text-sm">{{ success }}</div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Email</label>
                <input type="email" name="email" required
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400 transition"
                    placeholder="tu@email.com">
            </div>
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Contraseña</label>
                <input type="password" name="password" required minlength="8"
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400 transition"
                    placeholder="Min 8 chars, 1 mayúscula, 1 número">
            </div>
            <button type="submit"
                class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-cyan-900/50">
                Crear Cuenta
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/login" class="text-slate-400 hover:text-cyan-400 text-sm transition">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>
</body>
</html>
