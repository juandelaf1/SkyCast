name: CI

on:
  push:
    branches: [main, portfolio-analisis]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skycast_test
          POSTGRES_USER: skycast
          POSTGRES_PASSWORD: skycast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check app/ tests/

      - name: Create .env from example
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://skycast:skycast@localhost:5432/skycast_test" >> .env
          echo "TESTING=1" >> .env

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing
        env:
          AEMET_API_KEY: ""
          AEMET_BASE_URL: "https://opendata.aemet.es/opendata"
          SECRET_KEY: "test-secret-key-ci"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: skycast/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
